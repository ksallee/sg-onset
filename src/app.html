		<!-- The canvas of each scheme (--bg in lib/theme/palette.ts). The script below sets the stored theme. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ecedf2" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0b" />
		<script>
			// The theme (data-theme, data-night: lib/theme/tokens.css keys on them), the holding hand and
			// the motion before the first paint (lib/app/settings.ts, keep in step): the stored settings,
			// else what the device asks.
			var root = document.documentElement;
			try {
				var s = JSON.parse(localStorage.getItem('sg-onset.settings')) || {};
				var night = s.night === true;
				var dark = night || s.appearance === 'dark' || (s.appearance !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				root.dataset.theme = dark ? 'dark' : 'light';
				if (night) root.dataset.night = 'true';
				root.dataset.hand = s.hand === 'left' ? 'left' : 'right';
				root.dataset.motion = s.motion === 'full' || s.motion === 'reduced' ? s.motion : matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full';
				document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.removeAttribute('media'); m.content = night ? '#000000' : dark ? '#0A0A0B' : '#ECEDF2'; });
			} catch (e) {
				root.dataset.theme = 'dark';
				root.dataset.motion = 'full';
			}
		</script>

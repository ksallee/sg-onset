# The gates a branch passes before it merges, on every pull request and on the two branches
# anything lands on. After sg-task-templates' gates.yml.

name: Gates

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # package.json names no packageManager, so the version is here: the one the lockfile was
      # written with.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

      - run: pnpm build
